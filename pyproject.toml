[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autoexpert"
version = "1.0.0"
description = "AutoExpert — Intelligent Vehicle Diagnosis & Mechanic Expert System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AutoExpert Academic Team" }
]
dependencies = [
    "pydantic>=2.5.0",
    "jsonschema>=4.20.0"
]

[project.optional-dependencies]
backend = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.28",
    "reportlab>=4.1.0",
    "python-multipart>=0.0.9"
]
notebook = [
    "pandas>=2.2.0",
    "matplotlib>=3.8.0",
    "ipykernel>=6.29.0"
]
test = [
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]
dev = [
    "autoexpert[backend,notebook,test]"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["autoexpert_engine*", "backend*"]
